<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Blokowe Rivals</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#1b1d22;--fg:#f2f2f2;--ac:#5ac05a;--pn:#2b2e36;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);padding:12px;overflow:auto}
.card{background:var(--pn);border:3px solid #555;padding:20px;max-width:460px;width:100%;text-align:center}
h1{margin:0 0 12px;color:var(--ac);font-size:22px}
button,input{font:inherit;padding:10px 14px;margin:4px;border:2px solid #777;background:#3a3e48;color:var(--fg);cursor:pointer}
button:hover{background:var(--ac);color:#000}
input{cursor:text;width:80%}
.av{font-size:28px;padding:6px 10px}.av.sel{background:var(--ac)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud div{position:absolute;text-shadow:1px 1px 2px #000;font-weight:700}
#cross{left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px}
#hp{left:16px;bottom:16px;font-size:22px}#wp{right:16px;bottom:16px}
#rk{left:16px;top:16px}#msg{left:50%;top:18%;transform:translateX(-50%);color:#ffd84a;font-size:20px}
#flash{position:fixed;inset:0;background:red;opacity:0;pointer-events:none}
small{color:#aaa;display:block;margin-top:8px;line-height:1.5}
</style></head><body>

 scatter(4,rn,(x,z)=>deco(x,.02,z,7,.05,7,0xff5a14,1));
 wallX(-22,-35,35,[[-20,-14],[8,14]],4,TM)}
function bSnow(rn){
 scatter(30,rn,(x,z)=>{tree(x,z,0x4a3520,0x2f6f4a,3);deco(x,4.4,z,1.6,.4,1.6,0xffffff)});
 scatter(10,rn,(x,z)=>addC(x,z,2+rn()*2,2+rn()*2,2+rn()*2,0xbfe6ff));
 scatter(5,rn,(x,z)=>{addC(x,z,1.4,1.4,1.2,0xffffff);deco(x,1.2,z,1,1,1,0xffffff)})}
function start(i){
 const M=MAPS[i];$("ui").style.display="none";$("hud").style.display="block";
 if(!scene){R.setSize(innerWidth,innerHeight);}
 scene=new THREE.Scene();scene.background=new THREE.Color(M.sky);scene.fog=new THREE.Fog(M.sky,M.fn||25,M.ff||70);
 cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,120);cam.rotation.order="YXZ";
 scene.add(new THREE.AmbientLight(0xffffff,.7));const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(10,20,5);scene.add(dl);
 solid=[];obs=[];bots=[];kills=0;
 if(!TX.side){const L=new THREE.TextureLoader();
  TX.side=L.load(SIDE_TEX);TX.dirt=L.load(DIRT_TEX);TX.gd=L.load(DIRT_TEX);
  [TX.side,TX.dirt,TX.gd].forEach(t=>{t.magFilter=t.minFilter=THREE.NearestFilter});
  TX.gd.wrapS=TX.gd.wrapT=THREE.RepeatWrapping;TX.gd.repeat.set(20,50)}
 const sm=new THREE.MeshLambertMaterial({map:TX.side,color:M.tint}),tm=new THREE.MeshLambertMaterial({color:M.top}),dm=new THREE.MeshLambertMaterial({map:TX.dirt,color:M.tint});
 if(!TX.tnt){const L=new THREE.TextureLoader();[["tnt",TNT_TEX],["brick",BRICK_TEX],["ore",ORE_TEX]].forEach(a=>{const t=L.load(a[1]);t.magFilter=t.minFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;TX[a[0]]=t})}
 NETH=!!M.nether;
 if(NETH){const tn=new THREE.MeshLambertMaterial({map:TX.tnt});MT=[tn,tn,tn,tn,tn,tn]}else MT=[sm,sm,tm,dm,sm,sm];
 const gm=NETH?new THREE.MeshLambertMaterial({map:TX.brick}):(M.grid||M.flat)?new THREE.MeshLambertMaterial({color:M.g}):new THREE.MeshLambertMaterial({map:TX.gd,color:M.tint});
 const gr=new THREE.Mesh(scaleUV(new THREE.BoxGeometry(80,.2,80),80,.2,80,NETH),gm);gr.position.y=-.1;scene.add(gr);solid.push(gr);
 if(M.grid){const gh=new THREE.GridHelper(80,40,0x000000,0x333333);gh.position.y=.01;scene.add(gh)}
 [[0,-40,80,1],[0,40,80,1],[-40,0,1,80],[40,0,1,80]].forEach(w=>addObs(w[0],w[1],w[2],w[3],6,0x444444));
 const rn=rng(M.seed);
 if(M.b)M.b(rn);for(let k=0;k<(M.b?0:M.blocks);k++){const x=(rn()-.5)*70,z=(rn()-.5)*70;if(Math.abs(x)<5&&Math.abs(z)<5)continue;
  addObs(x,z,2+rn()*3,2+rn()*3,2+rn()*2,new THREE.Color().setHSL(rn(),.3,.4+rn()*.2).getHex())}
 makeWeapons();Object.assign(st,{x:0,y:0,z:0,vy:0,hp:100,w:0,slide:0,slideCd:0,spin:0,ammo:12,rl:0});setW(0);
 for(let k=0;k<M.bots;k++)makeBot();
 running=true;R.domElement.requestPointerLock&&R.domElement.requestPointerLock();
}
function setW(i){st.w=i;wgroups.forEach((g,k)=>g.visible=k===i);$("wp").textContent=["Pistolet","Karambit","Kalisong","Nóż"][i]+" ["+(i+1)+"]"}
const msg=t=>{$("msg").textContent=t;setTimeout(()=>{if($("msg").textContent===t)$("msg").textContent=""},1500)};
function gainKill(){kills++;const before=rankIdx();P.xp+=25;save();if(rankIdx()>before)msg("Awans: "+rankName(rankIdx())+"!");else msg("Zabity! +25 XP");$("cross").textContent="×";hit=.15}
function dmgBot(b,d){if(b.dead)return;b.hp-=d;if(b.hp<=0){b.dead=true;b.g.visible=false;b.rt=3;gainKill()}else{$("cross").textContent="×";hit=.1}}
function melee(d,range){
 const fx=-Math.sin(st.yaw),fz=-Math.cos(st.yaw);
 for(const b of bots){if(b.dead)continue;const dx=b.g.position.x-st.x,dz=b.g.position.z-st.z,L=Math.hypot(dx,dz);
  if(L<range&&(dx*fx+dz*fz)/(L||1)>.4)dmgBot(b,d)}
}
function shoot(){
 const rc=new THREE.Raycaster();rc.setFromCamera({x:0,y:0},cam);
 const meshes=solid.concat(bots.filter(b=>!b.dead).map(b=>b.g));
 const h=rc.intersectObjects(meshes,true)[0];
 if(h){let o=h.object;while(o&&!o.userData.bot&&o.parent!==scene)o=o.parent;if(o&&o.userData.bot){const hs=h.point.y>1.45;if(hs)msg("Headshot!");dmgBot(o.userData.bot,hs?68:34)}}
}
function hurt(d){st.hp-=d;$("flash").style.opacity=.4;setTimeout(()=>$("flash").style.opacity=0,120);
 if(st.hp<=0){st.hp=100;st.x=0;st.z=0;st.y=0;msg("Zginąłeś – odradzasz się")}}
// ---- input
addEventListener("keydown",e=>{keys[e.code]=true;
 if(!running)return;
 if(e.code==="KeyG"&&st.slide<=0&&st.slideCd<=0){let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyS?1:0)-(keys.KeyW?1:0);if(!mx&&!mz)mz=-1;
  const s=Math.sin(st.yaw),c=Math.cos(st.yaw),l=Math.hypot(mx,mz);mx/=l;mz/=l;
  st.sdx=mx*c+mz*s;st.sdz=-mx*s+mz*c;st.slide=.8;st.slideCd=1.5}
 if(e.code==="KeyR"&&st.w===0&&st.ammo<12&&st.rl<=0)st.rl=1.2;if(e.code==="Digit1")setW(0);if(e.code==="Digit2")setW(1);if(e.code==="Digit3")setW(2);if(e.code==="Digit4")setW(3);
 if(e.code==="Space")e.preventDefault();});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("mousedown",e=>{if(!running)return;if(e.button===0)mouse=true;if(document.pointerLockElement!==cv&&cv.requestPointerLock)cv.requestPointerLock()});
addEventListener("mouseup",e=>{if(e.button===0)mouse=false});
addEventListener("mousemove",e=>{if(!running||document.pointerLockElement!==cv)return;
 st.yaw-=e.movementX*.0022;st.pitch=Math.max(-1.5,Math.min(1.5,st.pitch-e.movementY*.0022))});
addEventListener("resize",()=>{R.setSize(innerWidth,innerHeight);if(cam){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}});
// ---- loop
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!running)return;update(dt);R.render(scene,cam)}
function update(dt){
 st.cd-=dt;st.slideCd-=dt;
 let sp=keys.ShiftLeft?7.5:5,mx=0,mz=0;
 if(st.slide>0){st.slide-=dt;mx=st.sdx;mz=st.sdz;sp=12*(st.slide/.8)+4}
 else{const f=(keys.KeyS?1:0)-(keys.KeyW?1:0),r=(keys.KeyD?1:0)-(keys.KeyA?1:0),l=Math.hypot(f,r)||1,s=Math.sin(st.yaw),c=Math.cos(st.yaw);
  mx=(r*c+f*s)/l;mz=(-r*s+f*c)/l}
 const nx=st.x+mx*sp*dt,nz=st.z+mz*sp*dt;
 if(!blocked(nx,st.z,st.y,.4))st.x=nx;if(!blocked(st.x,nz,st.y,.4))st.z=nz;
 if(keys.Space&&st.y<=0&&st.slide<=0)st.vy=7;
 st.vy-=20*dt;st.y=Math.max(0,st.y+st.vy*dt);if(st.y===0&&st.vy<0)st.vy=0;
 cam.position.set(st.x,st.y+(st.slide>0?.8:1.6),st.z);cam.rotation.set(st.pitch,st.yaw,st.slide>0?.08:0);
 // atak
 const w=st.w;st.kick*=.85;st.swing*=.88;
 if(mouse){
  if(w===1||w===2){st.spin+=dt*(w===1?22:16);st.tick-=dt;if(st.tick<=0){melee(w===1?25:35,2.6);st.tick=w===1?.25:.3}}
  else if(st.cd<=0){
   if(w===0&&st.rl<=0){if(st.ammo>0){shoot();st.ammo--;st.cd=.3;st.kick=1}else st.rl=1.2}
   if(w===3){melee(50,2.6);st.cd=.5;st.swing=1}}
 }
 if(!(mouse&&(w===1||w===2)))st.spin*=.88;
 wgroups.forEach(q=>{q.rotation.set(0,0,0);q.position.x=0});
 const wg=wgroups[w];
 if(w===1){wg.rotation.z=st.spin;wg.rotation.x=Math.sin(st.spin)*.3}
 if(w===2){wg.rotation.x=st.spin;wg.rotation.z=Math.sin(st.spin*.5)*.4}
 if(w===3){wg.rotation.z=-st.swing*1.8;wg.rotation.x=-st.swing*.9;wg.position.x=-st.swing*.25}
 vm.position.set(.35,-.32+(st.slide>0?-.05:0)+((mx||mz)&&st.y===0?Math.sin(now2()*10)*.012:0),-.6+st.kick*.12);
 vm.rotation.set(st.kick*.3+(st.rl>0?.6:0),0,0);
 // boty
 const eye=new THREE.Vector3(),rcs=new THREE.Raycaster();
 for(const b of bots){
  if(b.dead){b.rt-=dt;if(b.rt<=0)spawnBot(b);continue}
  const p=b.g.position,dx=st.x-p.x,dz=st.z-p.z,L=Math.hypot(dx,dz)||1;
  b.g.rotation.y=Math.atan2(dx,dz);
  eye.set(p.x,1.5,p.z);const dir=new THREE.Vector3(st.x,st.y+1.4,st.z).sub(eye).normalize();
  rcs.set(eye,dir);rcs.far=L;
  const see=rcs.intersectObjects(solid,false).length===0;
  b.ph+=dt;const mv=(L>9||!see)?1:0,str=see?Math.sin(b.ph*1.3)*.6:0;
  let vx=dx/L*mv+(-dz/L)*str,vz=dz/L*mv+(dx/L)*str;
  for(const o of bots){if(o!==b&&!o.dead){const ox=p.x-o.g.position.x,oz=p.z-o.g.position.z,d=Math.hypot(ox,oz);if(d<1.2&&d>0){vx+=ox/d;vz+=oz/d}}}
  const bx=p.x+vx*2.5*dt,bz=p.z+vz*2.5*dt;
  if(!blocked(bx,p.z,0,.5))p.x=bx;if(!blocked(p.x,bz,0,.5))p.z=bz;
  const sw=Math.sin(b.ph*8)*((mv||str)?.7:0);
  b.g.userData.parts.forEach(q=>q.m.rotation.x=sw*q.s);b.fl=(b.fl||0)-dt;b.g.userData.fl.visible=b.fl>0;
  b.sh-=dt;if(b.sh<=0&&L<30&&see){b.sh=1.2+Math.random();b.fl=.08;if(Math.random()<.4)hurt(8)}
 }
 if(st.rl>0){st.rl-=dt;if(st.rl<=0)st.ammo=12}
 hit-=dt;if(hit<=0)$("cross").textContent="+";
 $("hp").textContent="HP "+Math.max(0,Math.ceil(st.hp));
 $("wp").textContent=["Pistolet","Karambit","Kalisong","Nóż"][st.w]+(st.w===0?(st.rl>0?" - przeładowanie":" "+st.ammo+"/12"):"");
 $("rk").innerHTML=av()+" "+P.nick+" · "+rankName(rankIdx())+" · XP "+(P.xp%100)+"/100 · Zabójstwa: "+kills;
}
const now2=()=>performance.now()/1000;
requestAnimationFrame(frame);
screenAccount();
</script></body></html>
